# Stack deploy Geprekyukss (Odoo 19 + PostgreSQL 15).
# Semua pengaturan sensitif ada di file .env (lihat .env.example).
# Jalankan lewat ./deploy.sh atau `docker compose up -d`.
# Catatan: sengaja TANPA `name:` agar nama project/volume tetap sama dengan
# setup lama (DB tidak tampak hilang setelah restart).
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-odoo} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - odoo-net

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: geprekyukss/odoo:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      # Dibaca entrypoint image odoo -> dijadikan argumen --db_*.
      HOST: db
      PORT: "5432"
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ODOO_RC: /etc/odoo/odoo.conf
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command:
      - odoo
      - --admin-passwd=${ODOO_ADMIN_PASSWD:-admin}
      - --proxy-mode
      - --workers=${ODOO_WORKERS:-0}
      - --db-filter=${ODOO_DB_FILTER:-.*}
      - --log-level=${ODOO_LOG_LEVEL:-info}
      - --max-cron-threads=${ODOO_MAX_CRON_THREADS:-1}
    networks:
      - odoo-net

volumes:
  odoo-web-data:
  odoo-db-data:

networks:
  odoo-net:
